<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">

  <!-- Background — site's dark purple -->
  <rect width="32" height="32" rx="7" fill="#09091a"/>

  <!-- Two Bit — 2×2 pixel grid, diagonal bits ON (gold), diagonal bits OFF (dim) -->
  <!-- This is the "two bit" concept: 2 of 4 binary positions are active -->

  <!-- Bit 1 — top-left — ON -->
  <rect x="4" y="4" width="11" height="11" rx="2.5" fill="#f5c518"/>

  <!-- Bit 2 — top-right — OFF -->
  <rect x="17" y="4" width="11" height="11" rx="2.5" fill="#f5c518" opacity="0.12"/>

  <!-- Bit 3 — bottom-left — OFF -->
  <rect x="4" y="17" width="11" height="11" rx="2.5" fill="#f5c518" opacity="0.12"/>

  <!-- Bit 4 — bottom-right — ON -->
  <rect x="17" y="17" width="11" height="11" rx="2.5" fill="#f5c518"/>

</svg>
